name = "logistics-dashboard"
main = "worker/index.mjs"
compatibility_date = "2025-09-01"

# 静态资源：public/ 下的构建产物（index.html 由 assemble.py 生成）
# run_worker_first = true 让所有请求先过 Worker，这样 "/" 才能被登录拦住；
# 通过鉴权后再由 Worker 调 ASSETS 取真实文件。
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

# ---------------------------------------------------------------
# 非敏感配置。三个密钥不要写在这里，用 wrangler secret put 设置：
#   OPS_CLIENT_SECRET / OPS_SITE_MCP_KEY / OPS_SITE_AI_KEY
# ---------------------------------------------------------------
[vars]
OPS_SITE_ORIGIN = "https://logistics-dashboard.logistics-tracker.workers.dev"
OPS_CLIENT_ID = "app_SoR7dB_fMYx6yk-hqYzY-kJl"
OPS_REDIRECT_URI = "https://logistics-dashboard.logistics-tracker.workers.dev/ops/auth/callback"
OPS_AUTHORIZE_URL = "https://ops.htwig.com:10000/oauth/authorize"
OPS_TOKEN_URL = "https://ops.htwig.com:10000/api/oauth/token"
OPS_USERINFO_URL = "https://ops.htwig.com:10000/api/oauth/userinfo"
OPS_SCOPE = "openid profile"
OPS_SITE_MCP_URL = "https://ops.htwig.com:10000/api/assistant/ai/sites/11/mcp"
OPS_SITE_AI_URL = "https://ops.htwig.com:10000/api/assistant/ai/v1"
OPS_SITE_SKILLS_URL = "https://ops.htwig.com:10000/api/assistant/ai/sites/11/skills"
SESSION_TTL_SEC = "28800"
STATE_TTL_SEC = "600"
COOKIE_SECURE = "true"
COOKIE_SAME_SITE = "Lax"
