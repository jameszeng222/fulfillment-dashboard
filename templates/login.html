<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 履约监控系统</title>
<link rel="stylesheet" href="/static/app.css?v=minimal-workspace">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo">履</div>
    <h1>履约监控系统</h1>
    <!--OPS_LOGIN-->
    <!--CLOUD_LOGIN-->
    <p class="err" role="status"><!--LOGIN_MESSAGE--></p>
    <form id="form" <!--LOCAL_LOGIN_STATE-->>
    <div class="field">
      <label>用户名</label>
      <input id="u" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label>密码</label>
      <input id="p" type="password" autocomplete="current-password">
    </div>
    <button class="btn" style="width:100%;margin-top:6px" id="go">登 录</button>
    <div class="err" id="err"></div>
    </form>
  </div>
</div>
<script>
const form = document.getElementById('form');
const loginLink = new URLSearchParams(location.hash.slice(1));
const inviteEnabled = '<!--INVITE_STATE-->' === 'true';
const invitation = inviteEnabled ? loginLink.get('invite') : null;
const ticket = invitation || loginLink.get('cloud_ticket');
if (loginLink.has('invite') && !inviteEnabled) history.replaceState(null, '', location.pathname);
if (ticket) {
  history.replaceState(null, '', location.pathname);
  fetch(invitation ? '/api/cloud/invite/session' : '/api/cloud/session', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ticket})
  }).then(async response => {
    if (!response.ok) throw new Error(invitation ? '邀请已使用、过期或撤销。请联系管理员发送新链接。' :
      '登录链接已失效。请从本机桌面重新打开。');
    location.replace('/');
  }).catch(error => { document.querySelector('[role=status]').textContent = error.message; });
}
form.onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'), go = document.getElementById('go');
  err.textContent = ''; go.disabled = true; go.textContent = '登录中…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: document.getElementById('u').value.trim(),
                            password: document.getElementById('p').value})
    });
    const d = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(d.detail || '登录失败');
    location.href = new URLSearchParams(location.search).get('next') === '/assistant.html' ? '/assistant.html' : '/';
  } catch (ex) {
    err.textContent = ex.message;
    go.disabled = false; go.textContent = '登 录';
  }
};
</script>
</body>
</html>
