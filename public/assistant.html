<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能助手 · 履约监控系统</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2430;--ink2:#5b6675;--line:#e6ebf2;--brand:#2F5597;--bad:#d9534f;--ok:#2f9e6e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--ink);font-size:14px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 22px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{font-size:19px;font-weight:650}
h1 span{color:var(--brand)}
a.back{font-size:13px;color:var(--brand);text-decoration:none}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;color:var(--ink2);padding:7px 14px;border-radius:8px;
     cursor:pointer;font-family:inherit;font-size:13px}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:14px;font-weight:640;margin-bottom:10px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;
     font:13px/1.6 ui-monospace,Consolas,monospace;font-family:inherit;resize:vertical;outline:none}
textarea:focus,input:focus{border-color:var(--brand)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:13px;
     font-family:inherit;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.msg{padding:10px 12px;border-radius:9px;margin-bottom:9px;font-size:13.5px;line-height:1.75;white-space:pre-wrap}
.msg.u{background:#f1f5fd;border:1px solid #dbe6f7}
.msg.a{background:#f7f9fc;border:1px solid var(--line)}
.hint{font-size:12px;color:var(--ink2);line-height:1.7}
.err{color:var(--bad)}
.list{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.item{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.item:last-child{border-bottom:0}
.item b{font-weight:600}
.item .d{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.6}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
pre{background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    overflow:auto;max-height:320px;font-size:12px;line-height:1.6;white-space:pre-wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:#eef3fb;color:var(--brand)}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI 助手<span>.</span></h1>
    <div style="display:flex;gap:14px;align-items:center">
      <span class="hint" id="who">—</span>
      <a class="back" href="/">← 返回履约监控</a>
      <button type="button" class="btn ghost" id="assistLogout" hidden>退出登录</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab on" data-tab="ai">AI 对话</button>
    <button class="tab" data-tab="skill">技能</button>
  </div>

  <!-- AI -->
  <section id="tab-ai">
    <div class="card">
      <h2>与站点 AI 对话</h2>
      <div id="chat"></div>
      <textarea id="aiInput" rows="3" maxlength="8000" aria-label="问题" placeholder="输入你的问题"></textarea>
      <div class="row">
        <label id="modelLabel" hidden>模型 <select id="aiModel"></select></label>
        <span class="tag" id="activeSkill" hidden></span>
        <button class="btn" id="aiSend">发送</button>
        <button class="btn ghost" id="aiClear">清空</button>
        <span class="hint" id="aiMeta"></span>
      </div>
      <div class="hint" id="aiQuota" style="margin-top:8px"></div>
    </div>
  </section>

  <!-- 技能 -->
  <section id="tab-skill" class="hidden">
    <div class="card">
      <h2>已授权技能 <button class="btn ghost" id="skillReload" style="float:right">刷新</button></h2>
      <div class="hint" style="margin-bottom:10px">技能包下载后会按 sha256 校验，校验不过直接丢弃。</div>
      <div class="list" id="skillList"><div class="item hint">加载中…</div></div>
    </div>
    <div class="card">
      <h2>说明</h2>
      <div class="hint" id="skillNote">「标记使用」会向平台上报一次使用记录（含唯一 eventKey 与引擎名），用于统计技能实际被用到的次数。</div>
    </div>
  </section>
</div>

<script>
(function(){
  let ME = null;
  let selectedSkill = null;
  const $ = (id) => document.getElementById(id);
  const fulfillment = document.body.dataset.fulfillmentOps === 'true';

  async function api(path, opts){
    const o = Object.assign({headers:{}}, opts||{});
    o.headers = Object.assign({'Accept':'application/json'}, o.headers);
    if (o.body) { o.headers['Content-Type']='application/json'; }
    if (o.method && o.method !== 'GET' && ME) o.headers['X-CSRF-Token'] = ME.csrf;
    const r = await fetch(path, o);
    if (r.status === 401){
      location.href = (fulfillment ? '/login?next=' : '/?next=') + encodeURIComponent(location.pathname);
      throw new Error('unauth');
    }
    const t = await r.text();
    let j = {}; try { j = JSON.parse(t); } catch(e){ j = {message:t.slice(0,200)}; }
    if (!r.ok) throw Object.assign(new Error(j.message || (typeof j.detail === 'string' ? j.detail : '请求失败')),
      {code:j.error, status:r.status});
    return j;
  }

  function fail(el, e){
    const text = document.createElement('div');
    text.className = 'msg err';
    text.textContent = e.message || '请求失败';
    el.replaceChildren(text);
  }

  // ---------------- 初始化
  async function boot(){
    try{
      ME = await api(fulfillment ? '/api/ops/assistant' : '/api/me');
    }catch(e){ return; }
    const u = ME.user || {};
    $('who').textContent = u.display_name || u.name || u.username || u.sub || '';
    $('assistLogout').hidden = !fulfillment;
    if (!ME.features.ai){
      $('aiSend').disabled = true;
      $('aiInput').placeholder = '站点 AI 未配置';
    } else if (fulfillment) { loadModels(); }
    if (!ME.features.skills){
      $('skillList').innerHTML = '<div class="item hint">技能服务未配置</div>';
    } else if (fulfillment) {
      $('skillNote').textContent = '查看说明后，可在下一次对话使用该技能。回复成功后系统会记录一次使用。';
    } else { loadSkills(); }
  }

  $('assistLogout').onclick = async () => {
    try {
      await api('/api/logout', {method: 'POST'});
      location.href = '/login';
    } catch (e) {
      $('who').textContent = e.message;
    }
  };

  // ---------------- tabs
  document.querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===b));
      ['ai','skill'].forEach(k=>$('tab-'+k).classList.toggle('hidden', k!==b.dataset.tab));
      if (fulfillment && b.dataset.tab === 'skill' && ME?.features.skills) loadSkills();
    };
  });

  // ---------------- AI
  const history = [];
  async function loadModels(){
    $('aiSend').disabled = true;
    try {
      const out = await api('/api/ai/models');
      $('aiModel').replaceChildren(...out.models.map(model => new Option(model.id, model.id)));
      $('modelLabel').hidden = !out.models.length;
      $('aiSend').disabled = !out.models.length;
      $('aiMeta').textContent = out.models.length ? '' : '当前没有已授权模型';
    } catch (e) {
      $('aiMeta').textContent = e.message;
    }
  }

  function showQuota(){
    $('aiQuota').textContent = '额度不足，请联系管理员申请增加额度。';
    if (ME.quotaRequestUrl) {
      const link = document.createElement('a');
      link.href = ME.quotaRequestUrl;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = '前往申请额度';
      $('aiQuota').replaceChildren(link);
    }
  }

  $('aiSend').onclick = async () => {
    const text = $('aiInput').value.trim();
    if (!text) return;
    $('aiInput').value = '';
    history.push({role:'user', content:text});
    renderChat();
    $('aiSend').disabled = true;
    $('aiMeta').textContent = '思考中…';
    $('aiQuota').textContent = '';
    try{
      const body = {messages: history.slice(-20)};
      if (fulfillment) {
        body.model = $('aiModel').value;
        if (selectedSkill) body.skill_id = selectedSkill.id;
      }
      const out = await api('/api/ai/chat', {method:'POST', body: JSON.stringify(body)});
      history.push({role:'assistant', content: out.text || '（空回复）'});
      $('aiMeta').textContent = out.model ? ('模型 ' + out.model) : '';
      if (out.usageReported === false) $('aiMeta').textContent += ' · 技能使用记录上报失败';
      selectedSkill = null;
      $('activeSkill').hidden = true;
    }catch(e){
      history.pop();
      $('aiInput').value = text;
      $('aiMeta').textContent = e.message;
      if (e.code === 'AI_QUOTA') showQuota();
    }finally{
      $('aiSend').disabled = false;
      renderChat();
    }
  };
  $('aiClear').onclick = () => {
    if ($('aiSend').disabled && $('aiMeta').textContent === '思考中…') return;
    history.length = 0;
    selectedSkill = null;
    $('activeSkill').hidden = true;
    renderChat();
    $('aiMeta').textContent = '';
  };
  function renderChat(){
    $('chat').innerHTML = history.map(m =>
      '<div class="msg ' + (m.role==='user'?'u':'a') + '">' +
      String(m.content).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</div>').join('');
  }

  // ---------------- 技能
  async function loadSkills(refresh = false){
    $('skillList').innerHTML = '<div class="item hint">加载中…</div>';
    try{
      const out = await api('/api/skills' + (refresh ? '?refresh=1' : ''));
      const items = out.skills || [];
      if (selectedSkill && !items.some(item => item.id === selectedSkill.id)) {
        selectedSkill = null;
        $('activeSkill').hidden = true;
      }
      $('skillList').innerHTML = items.length
        ? items.map((s,i)=>'<div class="item"><div style="flex:1"><b>'+esc(s.name||s.id)+'</b>'+
            '<div class="d">'+esc(s.description||'')+'</div>'+
            '<div class="d mono">'+esc(s.id)+(s.version?' · v'+esc(s.version):'')+'</div></div>'+
            '<button class="btn ghost" data-s="'+i+'">'+(fulfillment ? '查看说明' : '标记使用')+'</button></div>').join('')
        : '<div class="item hint">没有已授权的技能</div>';
      $('skillList').querySelectorAll('button[data-s]').forEach(btn=>{
        btn.onclick = async ()=>{
          if (fulfillment) {
            const skill = items[+btn.dataset.s];
            btn.disabled = true;
            try {
              const result = await api('/api/skills/' + encodeURIComponent(skill.id) + '/instructions');
              const text = document.createElement('pre');
              text.textContent = result.instructions;
              $('skillNote').replaceChildren(text);
              if (ME.features.ai) {
                const use = document.createElement('button');
                use.className = 'btn';
                use.textContent = '用于下一次对话';
                use.onclick = () => {
                  selectedSkill = skill;
                  $('activeSkill').textContent = skill.name || skill.id;
                  $('activeSkill').hidden = false;
                  document.querySelector('[data-tab="ai"]').click();
                };
                $('skillNote').append(use);
              }
            } catch (e) { fail($('skillNote'), e); }
            finally { btn.disabled = false; }
            return;
          }
          btn.disabled = true; btn.textContent = '上报中…';
          try{
            await api('/api/skills/usage', {method:'POST', body: JSON.stringify({ids:[items[+btn.dataset.s].id]})});
            btn.textContent = '已上报'; btn.style.color = 'var(--ok)';
          }catch(e){ btn.disabled=false; btn.textContent='标记使用'; alert(e.message||'上报失败'); }
        };
      });
    }catch(e){ fail($('skillList'), e); }
  }
  $('skillReload').onclick = () => loadSkills(true);

  function esc(s){ return String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

  boot();
})();
</script>
</body>
</html>
