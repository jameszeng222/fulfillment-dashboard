<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能助手 · 履约监控系统</title>
<link rel="stylesheet" href="/static/app.css?v=soft-contrast">
<style>
.wrap{max-width:1080px;margin:0 auto;padding:32px 24px 48px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px}
h1{font-size:18px;font-weight:700}
.wrap .tabs{gap:16px;margin-bottom:24px;background:transparent;padding:0}
.wrap .tabs .tab{padding:8px 0;min-height:44px;border-radius:0}
.wrap .tab.on{color:var(--brand);box-shadow:inset 0 -2px var(--brand);font-weight:600}
.wrap .card{margin-bottom:24px}
.wrap .card h2{margin-bottom:12px}
textarea,input[type=text]{width:100%;border:1px solid transparent;border-radius:8px;padding:12px;background:var(--surface-muted);
     color:var(--ink);font:inherit;resize:vertical}
.row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.msg{padding:12px 16px;border-radius:12px;margin-bottom:12px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.msg.u{background:var(--surface-muted)}
.msg.a{background:var(--card)}
.hint{font-size:14px;color:var(--ink2);line-height:1.6}
.err{color:var(--bad)}
.item{padding:12px 0;display:flex;gap:12px;align-items:flex-start}
.item b{font-weight:600}
.item .d{color:var(--ink2);margin-top:4px;line-height:1.6}
pre{background:var(--surface-muted);border-radius:8px;padding:12px;
    overflow:auto;max-height:320px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.tag{padding:4px 8px;border-radius:8px;background:var(--surface-muted);color:var(--ink)}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI 助手</h1>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span class="hint" id="who">—</span>
      <a class="back" href="/">← 返回履约监控</a>
      <button type="button" class="btn ghost" id="assistLogout" hidden>退出登录</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab on" data-tab="ai">AI 对话</button>
    <button class="tab" data-tab="mcp">MCP 工具</button>
    <button class="tab" data-tab="skill">技能</button>
  </div>

  <!-- AI -->
  <section id="tab-ai">
    <div class="card">
      <div id="chat"></div>
      <textarea id="aiInput" rows="3" maxlength="8000" aria-label="问题" placeholder="输入你的问题"></textarea>
      <div class="row">
        <label id="modelLabel" hidden>模型 <select id="aiModel"></select></label>
        <span class="tag" id="activeSkill" hidden></span>
        <button class="btn" id="aiSend">发送</button>
        <button class="btn ghost" id="aiClear">清空</button>
        <span class="hint" id="aiMeta"></span>
      </div>
      <div class="hint" id="aiQuota" style="margin-top:8px"></div>
    </div>
  </section>

  <!-- MCP -->
  <section id="tab-mcp" class="hidden">
    <div class="card">
      <h2>站点 MCP 工具 <button class="btn ghost" id="mcpReload" style="float:right">刷新</button></h2>
      <div class="list" id="mcpList"><div class="item hint">加载中…</div></div>
    </div>
    <div class="card hidden" id="mcpCallCard">
      <h2>调用 <span class="mono" id="mcpName"></span></h2>
      <label for="mcpArgs">参数（JSON）</label>
      <textarea id="mcpArgs" rows="4">{}</textarea>
      <div class="row"><button class="btn" id="mcpRun">执行</button></div>
      <div id="mcpResult" style="margin-top:10px"></div>
    </div>
  </section>

  <!-- 技能 -->
  <section id="tab-skill" class="hidden">
    <div class="card">
      <h2>已授权技能 <button class="btn ghost" id="skillReload" style="float:right">刷新</button></h2>
      <div class="list" id="skillList"><div class="item hint">加载中…</div></div>
    </div>
    <div class="card">
      <h2>说明</h2>
      <div class="hint" id="skillNote">「标记使用」会向平台上报一次使用记录（含唯一 eventKey 与引擎名），用于统计技能实际被用到的次数。</div>
    </div>
  </section>
</div>

<script>
(function(){
  let ME = null;
  let selectedSkill = null;
  const $ = (id) => document.getElementById(id);
  const fulfillment = document.body.dataset.fulfillmentOps === 'true';

  async function api(path, opts){
    const o = Object.assign({headers:{}}, opts||{});
    o.headers = Object.assign({'Accept':'application/json'}, o.headers);
    if (o.body) { o.headers['Content-Type']='application/json'; }
    if (o.method && o.method !== 'GET' && ME) o.headers['X-CSRF-Token'] = ME.csrf;
    const r = await fetch(path, o);
    if (r.status === 401){
      location.href = (fulfillment ? '/login?next=' : '/?next=') + encodeURIComponent(location.pathname);
      throw new Error('unauth');
    }
    const t = await r.text();
    let j = {}; try { j = JSON.parse(t); } catch(e){ j = {message:t.slice(0,200)}; }
    if (!r.ok) throw Object.assign(new Error(j.message || (typeof j.detail === 'string' ? j.detail : '请求失败')),
      {code:j.error, status:r.status});
    return j;
  }

  function fail(el, e){
    const text = document.createElement('div');
    text.className = 'msg err';
    text.textContent = e.message || '请求失败';
    el.replaceChildren(text);
  }

  // ---------------- 初始化
  async function boot(){
    try{
      ME = await api(fulfillment ? '/api/ops/assistant' : '/api/me');
    }catch(e){ return; }
    const u = ME.user || {};
    $('who').textContent = u.display_name || u.name || u.username || u.sub || '';
    $('assistLogout').hidden = !fulfillment;
    if (!ME.features.ai){
      $('aiSend').disabled = true;
      $('aiInput').placeholder = '站点 AI 未配置';
    } else if (fulfillment) { loadModels(); }
    if (!ME.features.mcp){
      $('mcpList').innerHTML = '<div class="item hint">站点 MCP 未配置</div>';
    } else if (!fulfillment) { loadMcp(); }
    if (!ME.features.skills){
      $('skillList').innerHTML = '<div class="item hint">技能服务未配置</div>';
    } else if (fulfillment) {
      $('skillNote').textContent = '查看说明后，可在下一次对话使用该技能。回复成功后系统会记录一次使用。';
    } else { loadSkills(); }
  }

  $('assistLogout').onclick = async () => {
    try {
      await api('/api/logout', {method: 'POST'});
      location.href = '/login';
    } catch (e) {
      $('who').textContent = e.message;
    }
  };

  // ---------------- tabs
  document.querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===b));
      ['ai','mcp','skill'].forEach(k=>$('tab-'+k).classList.toggle('hidden', k!==b.dataset.tab));
      if (fulfillment && b.dataset.tab === 'mcp' && ME?.features.mcp) loadMcp();
      if (fulfillment && b.dataset.tab === 'skill' && ME?.features.skills) loadSkills();
    };
  });

  // ---------------- AI
  const history = [];
  async function loadModels(){
    $('aiSend').disabled = true;
    try {
      const out = await api('/api/ai/models');
      $('aiModel').replaceChildren(...out.models.map(model => new Option(model.id, model.id)));
      $('modelLabel').hidden = !out.models.length;
      $('aiSend').disabled = !out.models.length;
      $('aiMeta').textContent = out.models.length ? '' : '当前没有已授权模型';
    } catch (e) {
      $('aiMeta').textContent = e.message;
    }
  }

  function showQuota(){
    $('aiQuota').textContent = '额度不足，请联系管理员申请增加额度。';
    if (ME.quotaRequestUrl) {
      const link = document.createElement('a');
      link.href = ME.quotaRequestUrl;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = '前往申请额度';
      $('aiQuota').replaceChildren(link);
    }
  }

  $('aiSend').onclick = async () => {
    const text = $('aiInput').value.trim();
    if (!text) return;
    $('aiInput').value = '';
    history.push({role:'user', content:text});
    renderChat();
    $('aiSend').disabled = true;
    $('aiMeta').textContent = '思考中…';
    $('aiQuota').textContent = '';
    try{
      const body = {messages: history.slice(-20)};
      if (fulfillment) {
        body.model = $('aiModel').value;
        if (selectedSkill) body.skill_id = selectedSkill.id;
      }
      const out = await api('/api/ai/chat', {method:'POST', body: JSON.stringify(body)});
      history.push({role:'assistant', content: out.text || '（空回复）'});
      $('aiMeta').textContent = out.model ? ('模型 ' + out.model) : '';
      if (out.usageReported === false) $('aiMeta').textContent += ' · 技能使用记录上报失败';
      selectedSkill = null;
      $('activeSkill').hidden = true;
    }catch(e){
      history.pop();
      $('aiInput').value = text;
      $('aiMeta').textContent = e.message;
      if (e.code === 'AI_QUOTA') showQuota();
    }finally{
      $('aiSend').disabled = false;
      renderChat();
    }
  };
  $('aiClear').onclick = () => {
    if ($('aiSend').disabled && $('aiMeta').textContent === '思考中…') return;
    history.length = 0;
    selectedSkill = null;
    $('activeSkill').hidden = true;
    renderChat();
    $('aiMeta').textContent = '';
  };
  function renderChat(){
    $('chat').innerHTML = history.map(m =>
      '<div class="msg ' + (m.role==='user'?'u':'a') + '">' +
      String(m.content).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</div>').join('');
  }

  // ---------------- MCP
  let TOOLS = [];
  async function loadMcp(refresh = false){
    $('mcpList').innerHTML = '<div class="item hint">加载中…</div>';
    try{
      const out = await api('/api/mcp/tools' + (refresh ? '?refresh=1' : ''));
      TOOLS = out.tools || [];
      $('mcpList').innerHTML = TOOLS.length
        ? TOOLS.map((t,i)=>'<div class="item"><div style="flex:1"><b>'+esc(t.title||t.name)+'</b>'+
            '<div class="d">'+esc(t.description||'')+'</div>'+
            '<div class="d mono">'+esc(t.name)+'</div></div>'+
            '<button class="btn ghost" data-i="'+i+'">调用</button></div>').join('')
        : '<div class="item hint">本站点暂无可调用的工具</div>';
      $('mcpList').querySelectorAll('button[data-i]').forEach(btn=>{
        btn.onclick = ()=>{
          const t = TOOLS[+btn.dataset.i];
          $('mcpCallCard').classList.remove('hidden');
          $('mcpName').textContent = t.name;
          $('mcpResult').innerHTML = '';
          const props = (t.inputSchema && t.inputSchema.properties) || {};
          const tpl = {};
          Object.keys(props).forEach(k=>{ tpl[k] = props[k] && props[k].type === 'number' ? 0 : ''; });
          $('mcpArgs').value = JSON.stringify(tpl, null, 2);
        };
      });
    }catch(e){ fail($('mcpList'), e); }
  }
  $('mcpReload').onclick = () => loadMcp(true);
  $('mcpRun').onclick = async ()=>{
    $('mcpResult').innerHTML = '<div class="hint">执行中…</div>';
    $('mcpRun').disabled = true;
    try{
      let args = {};
      try { args = JSON.parse($('mcpArgs').value || '{}'); }
      catch(e){ throw new Error('参数不是合法 JSON'); }
      const out = await api('/api/mcp/call', {method:'POST',
        body: JSON.stringify({name: $('mcpName').textContent, arguments: args})});
      $('mcpResult').innerHTML = '<div class="hint" style="margin-bottom:6px">'+
        (out.ok ? '<span style="color:var(--ok)">调用成功</span>' : '<span class="err">工具返回错误</span>')+
        '</div><pre>'+esc(out.text || JSON.stringify(out.raw, null, 2))+'</pre>';
    }catch(e){ fail($('mcpResult'), e); }
    finally{ $('mcpRun').disabled = false; }
  };

  // ---------------- 技能
  async function loadSkills(refresh = false){
    $('skillList').innerHTML = '<div class="item hint">加载中…</div>';
    try{
      const out = await api('/api/skills' + (refresh ? '?refresh=1' : ''));
      const items = out.skills || [];
      if (selectedSkill && !items.some(item => item.id === selectedSkill.id)) {
        selectedSkill = null;
        $('activeSkill').hidden = true;
      }
      $('skillList').innerHTML = items.length
        ? items.map((s,i)=>'<div class="item"><div style="flex:1"><b>'+esc(s.name||s.id)+'</b>'+
            '<div class="d">'+esc(s.description||'')+'</div>'+
            '<div class="d mono">'+esc(s.id)+(s.version?' · v'+esc(s.version):'')+'</div></div>'+
            '<button class="btn ghost" data-s="'+i+'">'+(fulfillment ? '查看说明' : '标记使用')+'</button></div>').join('')
        : '<div class="item hint">没有已授权的技能</div>';
      $('skillList').querySelectorAll('button[data-s]').forEach(btn=>{
        btn.onclick = async ()=>{
          if (fulfillment) {
            const skill = items[+btn.dataset.s];
            btn.disabled = true;
            try {
              const result = await api('/api/skills/' + encodeURIComponent(skill.id) + '/instructions');
              const text = document.createElement('pre');
              text.textContent = result.instructions;
              $('skillNote').replaceChildren(text);
              if (ME.features.ai) {
                const use = document.createElement('button');
                use.className = 'btn';
                use.textContent = '用于下一次对话';
                use.onclick = () => {
                  selectedSkill = skill;
                  $('activeSkill').textContent = skill.name || skill.id;
                  $('activeSkill').hidden = false;
                  document.querySelector('[data-tab="ai"]').click();
                };
                $('skillNote').append(use);
              }
            } catch (e) { fail($('skillNote'), e); }
            finally { btn.disabled = false; }
            return;
          }
          btn.disabled = true; btn.textContent = '上报中…';
          try{
            await api('/api/skills/usage', {method:'POST', body: JSON.stringify({ids:[items[+btn.dataset.s].id]})});
            btn.textContent = '已上报'; btn.style.color = 'var(--ok)';
          }catch(e){ btn.disabled=false; btn.textContent='标记使用'; alert(e.message||'上报失败'); }
        };
      });
    }catch(e){ fail($('skillList'), e); }
  }
  $('skillReload').onclick = () => loadSkills(true);

  function esc(s){ return String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

  boot();
})();
</script>
</body>
</html>
