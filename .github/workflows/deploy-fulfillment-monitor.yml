name: Deploy fulfillment monitor to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main, codex/fulfillment-control-platform]
    paths:
      - cloudflare/**
      - app/**
      - static/**
      - templates/**
      - test/cloudflare-edge.mjs
      - .github/workflows/deploy-fulfillment-monitor.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-fulfillment-monitor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_PAGES_PROJECT: fulfillment-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify edge authentication and proxy behavior
        run: node --test test/cloudflare-edge.mjs
      - name: Publish the dedicated Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT")
          wrangler() { npx --yes --package=wrangler@4.135.0 wrangler "$@"; }
          case "$code" in
            200) ;;
            404) wrangler pages project create "$CF_PAGES_PROJECT" --production-branch main ;;
            *) echo "Cannot inspect the dedicated Pages project (HTTP $code)"; exit 1 ;;
          esac
          wrangler --cwd cloudflare pages deploy pages \
            --project-name "$CF_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Verify Pages deployment
        run: |
          set -euo pipefail
          url="https://$CF_PAGES_PROJECT.pages.dev"
          result=$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 15 "$url/__edge/health")
          jq -e '.status == "edge_ready" and (.originConfigured | type == "boolean")' <<< "$result"
          echo "Cloudflare entry: $url" >> "$GITHUB_STEP_SUMMARY"
          if jq -e '.originConfigured' <<< "$result" >/dev/null; then
            echo "Origin settings are present. Confirm authenticated access before sharing the site." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pages is live. The fulfillment backend still needs its private origin configured." >> "$GITHUB_STEP_SUMMARY"
          fi
