name: Deploy fulfillment monitor to Cloudflare

on:
  workflow_dispatch:
    inputs:
      retire_legacy:
        description: Redirect the retired static Pages dashboard to the fulfillment monitor
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - cloudflare/**
      - app/**
      - static/**
      - templates/**
      - test/cloudflare-edge.mjs
      - .github/workflows/deploy-fulfillment-monitor.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-fulfillment-monitor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_PAGES_PROJECT: fulfillment-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify edge authentication and proxy behavior
        run: node --test test/cloudflare-edge.mjs
      - name: Publish the dedicated Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FULFILLMENT_VPC_SERVICE_ID: ${{ vars.FULFILLMENT_VPC_SERVICE_ID }}
          FULFILLMENT_PRIVATE_WORKER_BOUND: ${{ vars.FULFILLMENT_PRIVATE_WORKER_BOUND }}
          FULFILLMENT_EDGE_KEY: ${{ secrets.FULFILLMENT_EDGE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT")
          wrangler() { npx --yes --package=wrangler@4.135.0 wrangler "$@"; }
          if [ -n "$FULFILLMENT_VPC_SERVICE_ID" ]; then
            worker_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/fulfillment-monitor-origin/settings")
            case "$worker_status" in
              200) ;; # Keep the privileged VPC binding managed on the existing Worker.
              404) wrangler --cwd cloudflare/private-worker deploy ;;
              *) echo "Cannot check the origin Worker (HTTP $worker_status)"; exit 1 ;;
            esac
          fi
          if [ "$FULFILLMENT_PRIVATE_WORKER_BOUND" = "true" ]; then
            test -n "$FULFILLMENT_VPC_SERVICE_ID"
            [[ "$FULFILLMENT_EDGE_KEY" =~ ^[A-Za-z0-9_-]{43,128}$ ]]
            printf '%s' "$FULFILLMENT_EDGE_KEY" | wrangler --cwd cloudflare pages secret put FULFILLMENT_EDGE_KEY --project-name "$CF_PAGES_PROJECT"
            printf '\n[vars]\nOPS_AUTHORIZE_URL = "https://ops.htwig.com:10000/oauth/authorize"\n\n[[services]]\nbinding = "FULFILLMENT_PRIVATE_WORKER"\nservice = "fulfillment-monitor-origin"\n' \
              >> cloudflare/wrangler.toml
          fi
          case "$code" in
            200) ;;
            404) wrangler pages project create "$CF_PAGES_PROJECT" --production-branch main ;;
            *) echo "Cannot inspect the dedicated Pages project (HTTP $code)"; exit 1 ;;
          esac
          wrangler --cwd cloudflare pages deploy pages \
            --project-name "$CF_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Verify Pages deployment
        run: |
          set -euo pipefail
          url="https://$CF_PAGES_PROJECT.pages.dev"
          result=$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 15 "$url/__edge/health")
          jq -e '.status == "edge_ready" and (.originConfigured | type == "boolean")' <<< "$result"
          echo "Cloudflare entry: $url" >> "$GITHUB_STEP_SUMMARY"
          if jq -e '.originConfigured' <<< "$result" >/dev/null; then
            echo "Origin settings are present. Confirm authenticated access before sharing the site." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pages is live. The fulfillment backend still needs its private origin configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retire the legacy static dashboard
        if: github.ref_name == 'main' && inputs.retire_legacy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          target="https://$CF_PAGES_PROJECT.pages.dev/"
          redirect_dir=$(mktemp -d)
          printf '/* %s 302\n' "$target" > "$redirect_dir/_redirects"
          printf '<!doctype html><meta charset="utf-8"><title>履约监控系统</title><a href="%s">打开新版履约监控系统</a>\n' "$target" > "$redirect_dir/index.html"
          npx --yes --package=wrangler@4.135.0 wrangler pages deploy "$redirect_dir" \
            --project-name logistics-dashboard --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
          actual=$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 15 \
            --output /dev/null --write-out '%{http_code} %{redirect_url}' https://logistics-dashboard.pages.dev/)
          test "$actual" = "302 $target"
