name: deploy-pages

# 推 main 就自动重建看板并发布到 Cloudflare Pages。
# 只跑 Python 标准库，不需要数据库——数据来自仓库里的 dashboard_src/cube.json。
#
# 启用方式（二选一）：
#   A. 授权 workflow 权限后挪进 .github/workflows/
#        gh auth refresh -s workflow
#        mkdir -p .github/workflows && git mv ops/deploy-pages.yml .github/workflows/deploy-pages.yml
#        git commit -m "启用自动部署" && git push
#   B. 直接在 GitHub 网页上新建 .github/workflows/deploy-pages.yml，粘贴本文件内容

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 组装单文件看板
        run: |
          python assemble.py
          mkdir -p dist
          cp public/index.html dist/index.html
          ls -lh dist/

      - name: 校验产物
        run: |
          python - <<'PY'
          import json, sys
          html = open("dist/index.html", encoding="utf-8").read()
          problems = []
          if "__DATA__" in html:            problems.append("__DATA__ 未替换")
          if "<!--ECHARTS-->" in html:      problems.append("ECHARTS 占位未替换")
          i = html.index("const D = {") + len("const D = ")
          data = json.loads(html[i:html.index(";\n", i)])
          orders = data["meta"]["orders"]
          if not isinstance(orders, int) or orders <= 0:
              problems.append(f"单量异常: {orders}")
          kb = len(html.encode()) / 1024
          if kb < 500: problems.append(f"产物只有 {kb:.0f} KB，疑似残缺")
          print(f"产物 {kb:.0f} KB，单量 {orders:,}，平台 {len(data['dims']['pfs'])} 个")
          if problems:
              print("FAIL:", "; ".join(problems)); sys.exit(1)
          PY

      - name: 发布到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=logistics-dashboard --branch=main
